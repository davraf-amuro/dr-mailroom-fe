# nginx per dr-mailroom-fe: SPA con router in history mode.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # File con hash nel nome: possono restare in cache a lungo
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Configurazione runtime montata dal compose: sempre riletta
    location = /config.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Ogni altra rotta torna a index.html, che il router risolve lato client
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
